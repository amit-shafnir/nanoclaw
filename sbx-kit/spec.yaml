schemaVersion: "1"
kind: sandbox
name: nanoclaw
displayName: NanoClaw
description: "NanoClaw host + nested per-session agent containers inside a Docker Sandbox micro-VM."

sandbox:
  image: "nanoclaw-sbx:local"
  entrypoint:
    run: ["/usr/local/bin/nanoclaw-start"]

caps:
  network:
    allow:
    - "api.anthropic.com:443"
    - "console.anthropic.com:443"
    - "claude.ai:443"
    - "onecli.sh:443"
    - "www.onecli.sh:443"
    - "api.onecli.sh:443"
    - "ghcr.io:443"
    - "registry-1.docker.io:443"
    - "auth.docker.io:443"
    - "index.docker.io:443"
    - "production.cloudflare.docker.com:443"
    - "github.com:443"
    - "api.github.com:443"
    - "codeload.github.com:443"
    - "raw.githubusercontent.com:443"
    - "objects.githubusercontent.com:443"
    - "release-assets.githubusercontent.com:443"
    - "registry.npmjs.org:443"
    - "checkpoint.prisma.io:443"
    - "deb.debian.org:443"
    - "security.debian.org:443"
    - "api.telegram.org:443"
    - "discord.com:443"
    - "gateway.discord.gg:443"
    - "api.slack.com:443"
    - "slack.com:443"
    - "downloads.claude.ai:443"
    - "claude.com:443"
    - "platform.claude.com:443"

publishedPorts:
  - container: 3000
    name: webhook
  - container: 10254
    name: onecli-dashboard
  - container: 10255
    name: onecli-gateway

environment:
  variables:
    CONTAINER_IMAGE: "nanoclaw-agent:latest"
    CONTAINER_IMAGE_BASE: "nanoclaw-agent"
    IS_SANDBOX: "1"
    NANOCLAW_NO_DIAGNOSTICS: "1"
    NODE_NO_WARNINGS: "1"
    ONECLI_BIND_HOST: "0.0.0.0"
    ONECLI_URL: "http://127.0.0.1:10254"
    TZ: "UTC"
    NO_PROXY: "127.0.0.1,localhost"
    no_proxy: "127.0.0.1,localhost"
agentContext: |
  ## Sandbox environment

  You are NanoClaw running inside a Docker Sandbox micro-VM. The host process
  spawns one nested agent container per session via the VM's own Docker daemon.
  Credentials go through OneCLI like a normal NanoClaw deployment. Never ask for
  or print raw keys. `sudo` is passwordless.
